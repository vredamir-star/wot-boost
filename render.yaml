services:
  - type: web
    name: wot-boost
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      # --- ЮKassa: секреты вносятся в Render Dashboard вручную, в репозиторий не попадают ---
      # Пустые ключи → MOCK-режим (тестовая оплата без денег)
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL   # например https://wot-boost.onrender.com или свой домен
        sync: false
      # Чек 54-ФЗ (необязательно): YOOKASSA_RECEIPT=true, YOOKASSA_VAT_CODE, YOOKASSA_TAX_SYSTEM_CODE

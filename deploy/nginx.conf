# Пример конфигурации nginx для TankBoost. Заменить example.ru и пути к сертификатам.
# Node-приложение слушает 127.0.0.1:3000 (см. PORT в .env).

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;   # доп. защита логина на уровне nginx

upstream wot_boost_app { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;
    return 301 https://example.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.ru;

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 64k;

    # ---- Заголовки безопасности ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Весь JS/CSS — свои файлы, инлайнов нет, поэтому CSP строгий.
    # form-action включает yoomoney на случай перехода к форме оплаты.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://yoomoney.ru; object-src 'none'" always;

    # Статика напрямую nginx'ом
    root /var/www/wot-boost/public;
    location ~* \.(css|js|png|jpg|svg|webp|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        # add_header внутри location отменяет наследование — повторяем ключевые заголовки
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ ^/api/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://wot_boost_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://wot_boost_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личный кабинет — TankBoost</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="/">Tank<span>Boost</span></a>
    <nav class="nav">
      <a href="/">Услуги</a>
      <a href="/cart.html">Корзина <span class="badge" id="cart-count">0</span></a>
      <a href="/account.html" id="nav-account">Кабинет</a>
      <a href="/login.html" id="nav-login">Войти</a>
    </nav>
  </header>
  <main class="container">
    <h1>Личный кабинет</h1>
    <div class="cols">
      <form id="profile" class="form card" novalidate>
        <h2>Профиль</h2>
        <p class="muted" id="profile-email"></p>
        <label>Имя <input name="display_name" maxlength="50"></label>
        <label>Ник в игре <input name="game_nickname" maxlength="24" pattern="[A-Za-z0-9_]*"></label>
        <label>Сервер
          <select name="game_server"><option value="">—</option><option>RU</option><option>EU</option><option>NA</option><option>ASIA</option></select>
        </label>
        <label>Telegram <input name="telegram" maxlength="33" pattern="@?[A-Za-z0-9_]*" placeholder="@nickname"></label>
        <p class="error"></p><p class="ok"></p>
        <button class="btn" type="submit">Сохранить</button>
        <button class="btn btn--ghost" type="button" id="logout">Выйти</button>
      </form>
      <form id="topup" class="form card" novalidate>
        <h2>Баланс: <span id="balance">—</span></h2>
        <label>Сумма пополнения, ₽ <input name="amount" type="number" min="100" max="100000" step="1" required value="500"></label>
        <p class="error"></p><p class="ok"></p>
        <button class="btn" type="submit">Пополнить через ЮKassa</button>
      </form>
    </div>
    <h2>Мои заказы</h2>
    <section id="orders" class="list"><p class="muted">Загрузка…</p></section>
  </main>
  <footer class="footer">
    <p>© TankBoost. Не связан с Lesta Games. «Мир танков» — товарный знак правообладателя.</p>
    <p><a href="/privacy.html">Политика конфиденциальности</a> · <a href="/consent.html">Согласие на обработку ПДн</a> · <a href="/offer.html">Публичная оферта</a></p>
  </footer>
  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>

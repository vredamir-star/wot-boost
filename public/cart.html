<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корзина — TankBoost</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="/">Tank<span>Boost</span></a>
    <nav class="nav">
      <a href="/">Услуги</a>
      <a href="/cart.html">Корзина <span class="badge" id="cart-count">0</span></a>
      <a href="/account.html" id="nav-account">Кабинет</a>
      <a href="/login.html" id="nav-login">Войти</a>
    </nav>
  </header>
  <main class="container">
    <h1>Корзина</h1>
    <section id="cart-list" class="list"></section>
    <form id="checkout" class="form card" novalidate>
      <p class="total">Итого: <strong id="cart-total">0 ₽</strong></p>
      <label>Комментарий к заказу (необязательно)
        <textarea name="comment" maxlength="500" rows="3" placeholder="Например, удобное время"></textarea>
      </label>
      <p class="error" id="checkout-error"></p>
      <button class="btn" type="submit">Оформить заказ</button>
    </form>
  </main>
  <footer class="footer">
    <p>© TankBoost. Не связан с Lesta Games. «Мир танков» — товарный знак правообладателя.</p>
    <p><a href="/privacy.html">Политика конфиденциальности</a> · <a href="/consent.html">Согласие на обработку ПДн</a> · <a href="/offer.html">Публичная оферта</a></p>
  </footer>
  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
